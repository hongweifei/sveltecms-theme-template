name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 宿主框架自动 clone 进 .sveltecms/ 并装配（scripts/ensure-host.mjs
      # 由 pnpm test 前置触发）——与本地开发同一条路径
      - name: Install theme deps
        run: pnpm install --frozen-lockfile
      - name: Contract self-check + unit tests (auto-ensures host)
        run: pnpm test
      - name: svelte-check
        run: pnpm check
      - name: 发布物根布局自检（zip 内 theme.config.ts 不得嵌套一层）
        run: |
          pnpm package
          unzip -l dist/*.zip | grep -E '(^|\s)theme\.config\.ts$' \
            || { echo '::error::theme.config.ts 不在 zip 根，宿主安装器会判 missing theme.config.ts'; exit 1; }
